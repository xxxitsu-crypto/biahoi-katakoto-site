<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SEAL TENNIS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="256" height="240"></canvas>
    
    <!-- モバイル用バーチャルパッド -->
    <div id="virtual-controller">
      <div id="dpad">
        <button class="dpad-btn" id="btn-up" aria-label="上">▲</button>
        <div class="dpad-middle">
          <button class="dpad-btn" id="btn-left" aria-label="左">◀</button>
          <button class="dpad-btn" id="btn-right" aria-label="右">▶</button>
        </div>
        <button class="dpad-btn" id="btn-down" aria-label="下">▼</button>
      </div>
      <div id="action-buttons">
        <button class="act-btn" id="btn-action" aria-label="ショット">A</button>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
