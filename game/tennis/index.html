<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-title" content="AZARASHI TENNIS">
  <meta name="application-name" content="AZARASHI TENNIS">
  <link rel="apple-touch-icon" href="assets/icon.png?v=62">
  <link rel="icon" type="image/png" href="assets/icon.png?v=62">
  <link rel="manifest" href="manifest.webmanifest?v=62">
  <title>AZARASHI TENNIS</title>
  <link rel="stylesheet" href="style.css?v=20261019-pause-62">
  <style>
    #game-container[data-screen="title"] .toolbar,
    #game-container[data-screen="title"] #status { display: none; }
    #game-container[data-screen="title"] #gameCanvas { cursor: pointer; }
  </style>
</head>
<body>
  <div id="game-container" data-screen="title">
    <p class="version">AZARASHI TENNIS · Version 63</p>
    <canvas id="gameCanvas" width="512" height="640"></canvas>
    
    <p id="status" role="status">読み込み中</p>
    <div class="toolbar">
      <button id="sound-toggle" type="button" aria-pressed="true">音：オン</button>
      <button id="guide-toggle" type="button" aria-pressed="false">打点ガイド</button>
    </div>
    <!-- コートと操作領域を分離。縦持ちは下、横持ちは左右へ配置。 -->
    <div id="virtual-controller">
      <div id="dpad">
        <button type="button" class="dpad-btn" id="btn-up" aria-label="上">▲</button>
        <div class="dpad-middle">
          <button type="button" class="dpad-btn" id="btn-left" aria-label="左">◀</button>
          <button type="button" class="dpad-btn" id="btn-right" aria-label="右">▶</button>
        </div>
        <button type="button" class="dpad-btn" id="btn-down" aria-label="下">▼</button>
      </div>
      <button type="button" id="btn-pause" aria-label="ポーズ" aria-pressed="false">ポーズ</button>
      <div id="action-buttons">
        <button type="button" class="act-btn" id="btn-action" aria-label="ショット">ショット</button>
      </div>
    </div>
  </div>

  <script defer src="main.js?v=20261019-63"></script>
</body>
</html>
