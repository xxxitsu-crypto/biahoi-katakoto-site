<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-title" content="AZARASHI TENNIS">
  <meta name="application-name" content="AZARASHI TENNIS">
  <link rel="apple-touch-icon" href="assets/icon.png?v=62">
  <link rel="icon" type="image/png" href="assets/icon.png?v=62">
  <link rel="manifest" href="manifest.webmanifest?v=62">
  <title>AZARASHI TENNIS</title>
  <link rel="stylesheet" href="style.css?v=ranking-72">
  <style>
    #game-container[data-screen="title"] .toolbar,
    #game-container[data-screen="title"] #status { display: none; }
    #game-container[data-screen="title"] #gameCanvas { cursor: pointer; }
  </style>
</head>
<body>
  <div id="game-container" data-screen="title">
    <p class="version">AZARASHI TENNIS · Version 72</p>
    <canvas id="gameCanvas" width="512" height="640"></canvas>
    
    <p id="status" role="status">読み込み中</p>
    <div class="toolbar">
      <button id="sound-toggle" type="button" aria-pressed="true">音：オン</button>
      <button id="guide-toggle" type="button" aria-pressed="false">打点ガイド</button>
    </div>
    <!-- コートと操作領域を分離。縦持ちは下、横持ちは左右へ配置。 -->
    <div id="virtual-controller">
      <div id="dpad">
        <button type="button" class="dpad-btn" id="btn-up" aria-label="上">▲</button>
        <div class="dpad-middle">
          <button type="button" class="dpad-btn" id="btn-left" aria-label="左">◀</button>
          <button type="button" class="dpad-btn" id="btn-right" aria-label="右">▶</button>
        </div>
        <button type="button" class="dpad-btn" id="btn-down" aria-label="下">▼</button>
      </div>
      <button type="button" id="btn-pause" aria-label="ポーズ" aria-pressed="false">ポーズ</button>
      <div id="action-buttons">
        <button type="button" class="act-btn" id="btn-action" aria-label="ショット">ショット</button>
      </div>
    </div>
  </div>

  <script>window.SEAL_START_STAGE = 3;</script>
  <button id="btn-give-up" type="button" hidden>ギブアップ</button>
  <dialog id="giveup-confirm" aria-label="OPEN画面に戻る？">
    <div id="giveup-confirm-panel">
      <img src="assets/ending-confirm.png" alt="OPEN画面に戻る？ YES NO" draggable="false">
      <img id="giveup-ball" src="assets/choice-ball.png" alt="" draggable="false">
      <button id="giveup-yes" type="button" aria-label="YES"></button>
      <button id="giveup-no" type="button" aria-label="NO"></button>
    </div>
  </dialog>
  <dialog id="ranking-dialog" aria-labelledby="ranking-heading">
    <section id="ranking-panel">
      <form id="ranking-form">
        <label for="ranking-name">ネーム</label>
        <input id="ranking-name" type="text" autocomplete="nickname" enterkeyhint="done" aria-label="名前（最大6文字）" aria-describedby="ranking-message">
      </form>
      <p id="ranking-stage" hidden></p>
      <p id="ranking-stage-points" hidden></p>
      <h1 id="ranking-heading"></h1>
      <p id="ranking-score"></p>
      <div id="ranking-breakdown"></div>
      <div id="ranking-table"></div>
      <p id="ranking-message" role="status"></p>
      <button id="ranking-submit" type="submit" form="ranking-form">ホームに戻る</button>
      <button id="ranking-next" type="button" hidden>登録せず進む</button>
    </section>
  </dialog>
  <script defer src="ranking-config.js?v=72"></script>
  <script defer src="scoring.js?v=72"></script>
  <script defer src="ranking.js?v=72"></script>
  <script defer src="main.js?v=ranking-72"></script>

</body>
</html>
